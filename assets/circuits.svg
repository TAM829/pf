<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="190" viewBox="0 0 1200 190" role="img" aria-labelledby="title desc">
<title id="title">Circuit traces converging toward the central profile</title>
<desc id="desc">Horizontal circuit bundles enter from the left and right edges and converge toward the central profile. Thick copper-like traces, vias and component pads add detail, while the bottom stays open.</desc>
